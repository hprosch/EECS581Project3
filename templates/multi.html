<!DOCTYPE html>
<html lang="en">
<!-- author: Wyatt Richard Payne -->
<!-- lobby for clients to wait for enough to connect to the server and play multiplayer mode -->
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Multiplayer</title>
	<!--links external source, CSS Stylesheet, to HTML -->
	<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
	<!--CDN-->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.4/socket.io.min.js"></script>
</head>
<body>
<h1 id="header"> {{ username }} against </h1>
	<script type="text/javascript">
		var opponent = '';
		$(document).ready(function() {
			var socket = io.connect("http://127.0.0.1:5000")
			socket.on('connect', function() {
				socket.send("User Connected!");
				socket.send({{ username | tojson }});
			});

			socket.on('submit_guess', function() {
				console.log("here");
			});

			socket.on('message', function(data) {
				if(data != {{ username | tojson }} && data != opponent && opponent == ''){
					$('#header').append(data);
					opponent = data;
				}else if(data != {{ username | tojson }}){
					$('#answers').append($('p').text(data));
				}
			});
		})
	</script>
	<h1>Wordle</h1>
	<p id="status" role="status" aria-live="polite"></p>
	<div class="controls">
		<a class="control-button" href="{{ url_for('home') }}">Main Menu</a>
		<button type="button" id="restart-button" class="control-button">New Game</button> <!-- button that resets the grid and starts a new game -->
		<button type="button" id="hint-button" class="control-button">Hint</button> <!-- placeholder hint button until the backend is ready -->
	</div> <!-- end of the controls container -->
	<!--creates css class-->
	<div class="board">
		<!--essentially creates 30 different <div> eleemnts-->
		{% for i in range(30) %}
		<!--There are 30 instances of the class tile and it has an index assigned to it-->
		<div class="tile" data-index="{{ i }}"></div>
		{% endfor %}
	</div>
	<div id="answers"></div>
	<div class="keyboard">
		<div class="keyboard-row">
			<button type="button" class="key">Q</button>
			<button type="button" class="key">W</button>
			<button type="button" class="key">E</button>
			<button type="button" class="key">R</button>
			<button type="button" class="key">T</button>
			<button type="button" class="key">Y</button>
			<button type="button" class="key">U</button>
			<button type="button" class="key">I</button>
			<button type="button" class="key">O</button>
			<button type="button" class="key">P</button>
		</div>
		<div class="keyboard-row">
			<button type="button" class="key">A</button>
			<button type="button" class="key">S</button>
			<button type="button" class="key">D</button>
			<button type="button" class="key">F</button>
			<button type="button" class="key">G</button>
			<button type="button" class="key">H</button>
			<button type="button" class="key">J</button>
			<button type="button" class="key">K</button>
			<button type="button" class="key">L</button>
		</div>
		<div class="keyboard-row">
			<button type="button" class="key wide-key">Enter</button>
			<button type="button" class="key">Z</button>
			<button type="button" class="key">X</button>
			<button type="button" class="key">C</button>
			<button type="button" class="key">V</button>
			<button type="button" class="key">B</button>
			<button type="button" class="key">N</button>
			<button type="button" class="key">M</button>
			<button type="button" class="key wide-key">Backspace</button>
		</div>
	</div>
	<script src="{{ url_for('static', filename='wordle.js') }}"></script>
</body>
</html>
</body>
</html>
